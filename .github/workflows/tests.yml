name: Lua regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['5.1', '5.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }} zip jq
      - name: Syntax and regression tests
        run: bash scripts/test.sh ${{ matrix.lua }}
      - name: Validate release package
        run: bash scripts/package.sh
