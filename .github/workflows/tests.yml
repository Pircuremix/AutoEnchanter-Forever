name: Lua regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ['5.1', '5.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua${{ matrix.lua }}
      - name: Validate syntax
        run: luac${{ matrix.lua }} -p AutoEnchanter/AutoEnchanter.lua
      - name: Regression tests
        run: lua${{ matrix.lua }} tests/regression.lua
