name: Publish Forever release
on:
  push:
    branches: [main]
    paths:
      - 'AutoEnchanter/AutoEnchanter.toc'
      - '.github/workflows/release.yml'
      - 'scripts/package.sh'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forever-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4 zip jq
      - name: Validate and test
        run: |
          bash scripts/test.sh 5.1
          bash scripts/test.sh 5.4
      - name: Build and publish versioned ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/^## Version: //p' AutoEnchanter/AutoEnchanter.toc | tr -d '\r')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version for a new release."
            exit 0
          fi
          bash scripts/package.sh
          gh release create "$tag" "AutoEnchanter-$version.zip" release.json --target "$GITHUB_SHA" --title "AutoEnchanter $version" --notes-file "docs/releases/v$version.md"
