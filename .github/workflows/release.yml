name: Publish Forever release
on:
  push:
    branches: [main]
    paths:
      - 'AutoEnchanter/AutoEnchanter.toc'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forever-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua5.4 zip
      - name: Validate and test
        run: |
          set -eu
          for v in 5.1 5.4; do
            luac$v -p AutoEnchanter/AutoEnchanter.lua
            lua$v tests/regression.lua
          done
      - name: Build and publish immutable versioned ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/^## Version: //p' AutoEnchanter/AutoEnchanter.toc | tr -d '\r')
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          tag="v$version"
          asset="AutoEnchanter-$version-forever.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version for a new release."
            exit 0
          fi
          zip -X "$asset" AutoEnchanter/AutoEnchanter.lua AutoEnchanter/AutoEnchanter.toc AutoEnchanter/AutoEnchanterIcon.blp
          unzip -t "$asset"
          gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "AutoEnchanter $version (Forever)" --generate-notes
